name: rosnect
description: Rosnect mobile app for connecting phone sensors to the ROS 2 embedded bridge.
publish_to: "none"

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  ros2_embedded_bridge_client:
    path: ..

dev_dependencies:
  flutter_launcher_icons: ^0.13.1
  flutter_test:
    sdk: flutter
  lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/dark_rosnect.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/dark_rosnect.png
  remove_alpha_ios: true
