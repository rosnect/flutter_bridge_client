name: ros2_embedded_bridge_client
description: MQTT client for connecting Flutter devices to ros2embedded and ROS 2, with typed payloads, TLS and acknowledged device interface discovery.
version: 0.1.0
homepage: https://github.com/rosnect/flutter_bridge_client
repository: https://github.com/rosnect/flutter_bridge_client
issue_tracker: https://github.com/rosnect/flutter_bridge_client/issues
topics:
  - ros2
  - robotics
  - mqtt
  - iot
  - sensors

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  mqtt_client: ^10.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^3.0.0

platforms:
  android:
  ios:
  linux:
  macos:
  windows:
